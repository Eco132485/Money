name: Python tests
on:
  push:
    branches:
      - feature/isa-dual-market-free-paper
      - feature/isa-50usd-paper-account-hardening
      - feature/autonomous-trading-agent
  pull_request:
    branches:
      - feature/widowmaker-bolt-integration
      - feature/autonomous-trading-agent
      - feature/isa-50usd-paper-account-hardening
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        env:
          ISA_GEMINI_FREE_TIER_CONFIRMED: "false"
          TRADING_MODE: paper
        run: pytest -q
