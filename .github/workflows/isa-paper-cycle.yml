name: ISA autonomous paper cycle

on:
  schedule:
    # Best-effort every five minutes, offset from the top of the hour.
    - cron: "7-59/5 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Set true only for the first-ever paper account initialisation"
        required: false
        type: boolean
        default: false
      archive_and_reset:
        description: "Archive the restored legacy paper account, then create a fresh $50 simulation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: isa-paper-cycle
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out ISA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore virtual portfolio database
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: data/trading.db*
          key: isa-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            isa-paper-state-

      - name: Fail closed if the saved paper account is missing
        if: steps.state-cache.outputs.cache-matched-key == '' && inputs.bootstrap != true && inputs.archive_and_reset != true
        run: |
          echo "::error::No saved ISA paper-account state was found. Refusing to create a fresh $50 account automatically. Only use the bootstrap option for the first-ever setup."
          exit 1

      - name: Archive the existing paper account before migration
        if: inputs.archive_and_reset == true
        run: |
          set -euo pipefail
          if [ -z "${{ steps.state-cache.outputs.cache-matched-key }}" ]; then
            echo "::error::No cached account was restored; refusing to claim an archive or create a replacement."
            exit 1
          fi
          if [ ! -f data/trading.db ]; then
            echo "::error::The restored SQLite database is missing; refusing migration."
            exit 1
          fi
          mkdir -p migration-archive
          tar -czf "migration-archive/legacy-isa-paper-state-${{ github.run_id }}.tar.gz" data/trading.db*
          echo "Archived the restored legacy database and SQLite sidecar files."

      - name: Preserve legacy account as a downloadable artifact
        if: inputs.archive_and_reset == true
        uses: actions/upload-artifact@v4
        with:
          name: legacy-isa-paper-state-${{ github.run_id }}
          path: migration-archive/legacy-isa-paper-state-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Start a fresh $50 simulation after archive verification
        if: inputs.archive_and_reset == true
        run: |
          set -euo pipefail
          test -s "migration-archive/legacy-isa-paper-state-${{ github.run_id }}.tar.gz"
          rm -f data/trading.db data/trading.db-wal data/trading.db-shm
          echo "Legacy state archived and verified; the paper runner will initialise a new 50 USD virtual account."

      - name: Install free open-source dependencies
        if: steps.state-cache.outputs.cache-matched-key != '' || inputs.bootstrap == true || inputs.archive_and_reset == true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one paper-only dual-market cycle
        if: steps.state-cache.outputs.cache-matched-key != '' || inputs.bootstrap == true || inputs.archive_and_reset == true
        env:
          TRADING_MODE: paper
          DB_PATH: data/trading.db
          ISA_GEMINI_API_KEY: ${{ secrets.ISA_GEMINI_API_KEY }}
          ISA_GEMINI_FREE_TIER_CONFIRMED: ${{ secrets.ISA_GEMINI_FREE_TIER_CONFIRMED }}
          OLLAMA_ENABLED: ${{ vars.OLLAMA_ENABLED }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_TIMEOUT_SECONDS: ${{ vars.OLLAMA_TIMEOUT_SECONDS }}
          KRONOS_ENABLED: ${{ vars.KRONOS_ENABLED }}
          KRONOS_REQUIRED: ${{ vars.KRONOS_REQUIRED }}
          KRONOS_API_URL: ${{ secrets.KRONOS_API_URL }}
          KRONOS_API_KEY: ${{ secrets.KRONOS_API_KEY }}
          KRONOS_TIMEOUT_SECONDS: ${{ vars.KRONOS_TIMEOUT_SECONDS }}
        run: |
          mkdir -p data
          if [ -z "$ISA_GEMINI_API_KEY" ] || [ "$ISA_GEMINI_FREE_TIER_CONFIRMED" != "true" ]; then
            echo "Gemini is not configured as confirmed free-tier. The agent will HOLD and place no new trades."
          fi
          python scripts/run_paper.py --cycles 1

      - name: Save virtual portfolio database
        if: success() && hashFiles('data/trading.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/trading.db*
          key: isa-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
