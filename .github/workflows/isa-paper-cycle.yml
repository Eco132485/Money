name: ISA autonomous paper cycle

on:
  schedule:
    # Best-effort every five minutes, offset from the top of the hour.
    - cron: "7-59/5 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Set true only for the first-ever paper account initialisation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: isa-paper-cycle
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out ISA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore virtual portfolio database
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: data/trading.db*
          key: isa-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            isa-paper-state-

      - name: Fail closed if the saved paper account is missing
        if: steps.state-cache.outputs.cache-matched-key == '' && inputs.bootstrap != true
        run: |
          echo "::error::No saved ISA paper-account state was found. Refusing to create a fresh $1,000 account automatically. Only use the bootstrap option for the first-ever setup."
          exit 1

      - name: Install free open-source dependencies
        if: steps.state-cache.outputs.cache-matched-key != '' || inputs.bootstrap == true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run one paper-only dual-market cycle
        if: steps.state-cache.outputs.cache-matched-key != '' || inputs.bootstrap == true
        env:
          TRADING_MODE: paper
          DB_PATH: data/trading.db
          ISA_GEMINI_API_KEY: ${{ secrets.ISA_GEMINI_API_KEY }}
          ISA_GEMINI_FREE_TIER_CONFIRMED: ${{ secrets.ISA_GEMINI_FREE_TIER_CONFIRMED }}
        run: |
          mkdir -p data
          if [ -z "$ISA_GEMINI_API_KEY" ] || [ "$ISA_GEMINI_FREE_TIER_CONFIRMED" != "true" ]; then
            echo "Gemini is not configured as confirmed free-tier. The agent will HOLD and place no new trades."
          fi
          python scripts/run_paper.py --cycles 1

      - name: Save virtual portfolio database
        if: success() && hashFiles('data/trading.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/trading.db*
          key: isa-paper-state-${{ github.run_id }}-${{ github.run_attempt }}
